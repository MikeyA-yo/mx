[workspace]
resolver = "3"
members = ["crates/mx-core", "crates/mx-cli", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mx-core = { path = "crates/mx-core" }
anyhow = "1.0.104"
ctrlc = "3.5.2"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.1"
url = "2.5.8"
